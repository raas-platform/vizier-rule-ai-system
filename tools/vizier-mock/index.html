<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vizier 로컬 테스트</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --mute:#6b7280; --line:#e3e6ea; --acc:#2563eb;
          --err:#dc2626; --warn:#d97706; --info:#2563eb; --ok:#16a34a; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:12px 16px; background:#1d2330; color:#fff; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  header input { width:260px; padding:5px 8px; border-radius:4px; border:0; }
  #health { font-size:12px; }
  main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; padding:12px 16px; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  select, button { padding:6px 10px; border-radius:4px; border:1px solid var(--line); background:#fff; font:inherit; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); font-weight:600; }
  button:disabled { opacity:.5; }
  textarea { width:100%; height:60vh; font:12px/1.4 ui-monospace,Consolas,monospace; border:1px solid var(--line); border-radius:4px; padding:8px; }
  pre { background:#0f172a; color:#e2e8f0; padding:10px; border-radius:6px; overflow:auto; max-height:50vh; font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:6px; text-align:left; vertical-align:top; }
  .sev { font-weight:700; } .sev.error{color:var(--err)} .sev.warning{color:var(--warn)} .sev.info{color:var(--info)}
  .mute { color:var(--mute); font-size:12px; }
  .summary { font-weight:600; margin:4px 0 8px; }
  .ai { background:#eef4ff; border-radius:4px; padding:4px 6px; margin-top:4px; font-size:12px; }
  .status { font-size:12px; }
  details { margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>Vizier 로컬 테스트</h1>
  <label>서버 <input id="base" value="http://localhost:8000"></label>
  <button id="ping">연결 확인</button>
  <span id="health"></span>
</header>
<main>
  <section class="card">
    <div class="row">
      <select id="sample"></select>
      <button id="load">샘플 불러오기</button>
      <button id="fmt">JSON 정리</button>
    </div>
    <textarea id="input" spellcheck="false" placeholder="룰 JSON 배열을 붙여넣으세요"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="validate" class="primary">검증</button>
      <span id="status" class="status mute"></span>
    </div>
  </section>
  <section class="card">
    <div id="result" class="mute">왼쪽에서 룰을 넣고 검증을 누르세요.</div>
    <details><summary>원본 응답 JSON</summary><pre id="raw"></pre></details>
  </section>
</main>

      "keyName": "IS_PREMIUM",
      "dispName": "프리미엄 여부",
      "operator": "==",
      "value": "maybe",
      "fieldDataType": "Boolean"
     },
     {
      "condUuid": "cond-003",
      "keyName": "SCORE",
      "dispName": "점수",
      "operator": ">",
      "value": "abc",
      "fieldDataType": "Number"
     }
    ]
   }
  }
 ]
};
const $ = id => document.getElementById(id);
const base = () => $('base').value.replace(/\/+$/, '');
try { const b = localStorage.getItem('vizier-base'); if (b) $('base').value = b; } catch (e) {}
$('base').addEventListener('change', () => { try { localStorage.setItem('vizier-base', $('base').value); } catch (e) {} });

for (const name of Object.keys(SAMPLES)) $('sample').add(new Option(name, name));
const loadSample = () => { $('input').value = JSON.stringify(SAMPLES[$('sample').value], null, 2); };
$('load').onclick = loadSample;
loadSample();

$('fmt').onclick = () => {
  try { $('input').value = JSON.stringify(JSON.parse($('input').value), null, 2); }
  catch (e) { $('status').textContent = 'JSON 형식 오류: ' + e.message; }
};

$('ping').onclick = async () => {
  $('health').textContent = '확인 중…';
  try {
    const r = await fetch(base() + '/health');
    $('health').textContent = r.ok ? '✅ 연결됨' : '⚠️ HTTP ' + r.status;
  } catch (e) { $('health').textContent = '❌ 연결 실패 (' + e.message + ')'; }
};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(data) {
  if (!data || !Array.isArray(data.issues)) { $('result').innerHTML = '<div class="mute">issues 필드가 없는 응답입니다. 원본 JSON을 확인하세요.</div>'; return; }
  const counts = Object.entries(data.issue_counts || {}).map(([k, v]) => `${esc(k)} ${v}`).join(' · ');
  let h = `<div class="summary">${data.is_valid ? '✅' : '❌'} ${esc(data.summary)}</div>`;
  if (counts) h += `<div class="mute">${counts}</div>`;
  if (data.ai_comment) h += `<div class="ai"><b>AI 코멘트</b> ${esc(data.ai_comment)}</div>`;
  if (data.issues.length) {
    h += '<table><thead><tr><th>심각도</th><th>유형</th><th>조건</th><th>설명 / 제안</th></tr></thead><tbody>';
    for (const i of data.issues) {
      h += `<tr><td class="sev ${esc(i.severity)}">${esc(i.severity)}</td><td>${esc(i.issue_type)}</td>
        <td>${esc(i.keyName)}<div class="mute">${esc(i.condUuid)}</div></td>
        <td>${esc(i.explanation)}<div class="mute">→ ${esc(i.suggestion)}</div>
        ${i.ai_explanation ? `<div class="ai"><b>AI</b> ${esc(i.ai_explanation)}${i.ai_suggestion ? '<br>→ ' + esc(i.ai_suggestion) : ''}</div>` : '<div class="mute">AI 설명 없음</div>'}</td></tr>`;
    }
    h += '</tbody></table>';
  }
  $('result').innerHTML = h;
}

$('validate').onclick = async () => {
  let body;
  try { body = JSON.parse($('input').value); }
  catch (e) { $('status').textContent = 'JSON 형식 오류: ' + e.message; return; }
  if (!Array.isArray(body)) body = [body];  // 단일 룰 객체도 배열로 감싸서 전송
  $('validate').disabled = true;
  $('status').textContent = '검증 중…';
  const t0 = performance.now();
  try {
    const r = await fetch(base() + '/rules/validate-json', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const text = await r.text();
    let data; try { data = JSON.parse(text); } catch (e) { data = text; }
    $('raw').textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    $('status').textContent = `HTTP ${r.status} · ${Math.round(performance.now() - t0)}ms`;
    if (r.ok) render(data);
    else { $('result').innerHTML = `<div class="sev error">요청 실패 (HTTP ${r.status})</div>`; $('raw').parentElement.open = true; }
  } catch (e) {
    $('status').textContent = '요청 실패: ' + e.message + ' (서버 주소와 실행 여부를 확인하세요)';
  } finally { $('validate').disabled = false; }
};
</script>
</body>
</html>
