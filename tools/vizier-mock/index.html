<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vizier 룰 디자인 테스트</title>
<style>
  :root {
    --bg: #f4f6fa; --panel: #fff; --line: #d7dce5; --text: #1f2633; --muted: #6b7486;
    --and: #2f6fde; --and-bg: #e8f0fd; --or: #c06a12; --or-bg: #fdf1e3;
    --err: #d23c3c; --err-bg: #fdecec; --warn: #b7860b; --warn-bg: #fdf6df;
    --ok: #1f9a5a; --ok-bg: #e5f6ec; --accent: #3557d6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  header { background: #1e2a44; color: #fff; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 16px 0 0; font-weight: 700; letter-spacing: .3px; }
  header label { font-size: 12px; opacity: .8; }
  header input, header select { padding: 6px 8px; border-radius: 6px; border: 1px solid #44527a; background: #2a3858; color: #fff; font: inherit; }
  header input { width: 220px; }
  .conn { font-size: 12px; padding: 3px 8px; border-radius: 10px; background: #44527a; }
  .conn.ok { background: var(--ok); } .conn.bad { background: var(--err); }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--text); padding: 5px 10px; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; padding: 7px 18px; }
  button.primary:hover { background: #2846b8; color: #fff; }
  button.primary:disabled { opacity: .6; cursor: wait; }
  button.ghost { background: transparent; color: #cfd6e6; border-color: #44527a; }
  button.small { font-size: 12px; padding: 2px 8px; }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  .spacer { flex: 1; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 20px 60px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .rule-meta { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; align-items: center; }
  .rule-meta label { color: var(--muted); font-size: 12px; }
  .rule-meta input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }

  /* 요약 */
  #summary { display: none; }
  #summary.show { display: block; }
  .sum-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .verdict { font-weight: 700; padding: 4px 12px; border-radius: 14px; }
  .verdict.ok { background: var(--ok-bg); color: var(--ok); }
  .verdict.bad { background: var(--err-bg); color: var(--err); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 10px; background: #eef1f6; color: #3a4357; }
  .chip b { margin-left: 4px; }
  .scores { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .scores strong { color: var(--text); font-size: 15px; margin-left: 4px; }
  .ai-comment { margin-top: 10px; padding: 10px 12px; background: #f3f0fd; border-left: 3px solid #7a5af0; border-radius: 6px; white-space: pre-wrap; font-size: 13px; }
  .err-box { margin-top: 8px; padding: 10px 12px; background: var(--err-bg); color: var(--err); border-radius: 6px; white-space: pre-wrap; font-size: 13px; }

  /* 트리 */
  .tree-title { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .tree-title h2 { font-size: 15px; margin: 0; }
  .legend { font-size: 12px; color: var(--muted); }
  ul.tree { list-style: none; margin: 0; padding-left: 26px; position: relative; }
  ul.tree.root { padding-left: 0; }
  ul.tree li { position: relative; padding: 5px 0; }
  ul.tree:not(.root) > li::before { content: ""; position: absolute; left: -16px; top: 0; bottom: 0; border-left: 2px solid var(--line); }
  ul.tree:not(.root) > li:last-child::before { bottom: auto; height: 22px; }
  ul.tree:not(.root) > li::after { content: ""; position: absolute; left: -16px; top: 22px; width: 14px; border-top: 2px solid var(--line); }

  .group { display: inline-flex; flex-wrap: wrap; max-width: 100%; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 8px; border: 1px solid; }
  .group.AND { background: var(--and-bg); border-color: #b7cdf6; }
  .group.OR  { background: var(--or-bg);  border-color: #f0cfa6; }
  .logic { font-weight: 800; border: none; border-radius: 5px; padding: 2px 10px; color: #fff; }
  .group.AND .logic { background: var(--and); } .group.OR .logic { background: var(--or); }
  .logic:hover { filter: brightness(1.1); color: #fff; }
  .group .hint { font-size: 12px; color: var(--muted); }

  .cond { display: inline-block; min-width: 360px; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .cond.has-error { border-color: var(--err); box-shadow: 0 0 0 2px var(--err-bg); }
  .cond.has-warning { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn-bg); }
  .cond.clean { border-color: #9fd8b8; }
  .cond-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 6px 10px; cursor: pointer; }
  .cond-row > *, .group > *, .badge, button { white-space: nowrap; }
  .cond-row .uuid { font-size: 11px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .cond-row .name { font-weight: 600; }
  .cond-row .key { font-size: 12px; color: var(--muted); }
  .cond-row .op { font-family: ui-monospace, Consolas, monospace; font-weight: 700; color: var(--accent); background: #eef1fb; padding: 0 6px; border-radius: 4px; }
  .cond-row .val { font-weight: 600; }
  .cond-row .type { font-size: 11px; padding: 0 6px; border-radius: 4px; background: #eef1f6; color: #4b5568; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 9px; }
  .badge.error { background: var(--err); color: #fff; }
  .badge.warning { background: var(--warn); color: #fff; }
  .badge.ok { background: var(--ok); color: #fff; }
  .row-actions { margin-left: auto; display: flex; gap: 4px; }

  .editor { display: none; padding: 8px 10px 10px; border-top: 1px dashed var(--line); background: #fafbfd; border-radius: 0 0 8px 8px; }
  .cond.editing .editor { display: grid; grid-template-columns: repeat(5, minmax(90px, 1fr)); gap: 6px; }
  .editor label { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); }
  .editor input, .editor select { font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--text); }

  .issues { padding: 0 10px 8px; }
  .issue { margin-top: 6px; padding: 7px 10px; border-radius: 6px; font-size: 13px; border-left: 3px solid; }
  .issue.error { background: var(--err-bg); border-color: var(--err); }
  .issue.warning { background: var(--warn-bg); border-color: var(--warn); }
  .issue .itype { font-weight: 700; margin-right: 6px; }
  .issue .ai { margin-top: 4px; color: #4a3fa0; }
  .issue .ai::before { content: "AI 설명 · "; font-weight: 700; }
  .issue .sugg { margin-top: 4px; color: #2d5d3f; }
  .issue .sugg::before { content: "제안 · "; font-weight: 700; }
  .rule-issues h3 { font-size: 13px; margin: 0 0 4px; }

  .empty { color: var(--muted); font-size: 13px; padding: 4px 0; }
  .issue { overflow-wrap: anywhere; }
  @media (max-width: 700px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    header input { width: 100%; }
    ul.tree { padding-left: 18px; }
    ul.tree:not(.root) > li::before, ul.tree:not(.root) > li::after { left: -11px; }
    ul.tree:not(.root) > li::after { width: 9px; }
    .cond { min-width: 0; width: 100%; }
    .cond.editing .editor { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Vizier 룰 디자인 · 로컬 테스트</h1>
  <label for="server">서버</label>
  <input id="server" value="http://localhost:8000">
  <button class="ghost small" id="btnPing">연결 확인</button>
  <span class="conn" id="conn">미확인</span>
  <span class="spacer"></span>
  <label for="sample">샘플</label>
  <select id="sample"></select>
  <button class="ghost small" id="btnNew">새 룰</button>
  <button class="primary" id="btnValidate">검증</button>
</header>

<main>
  <section class="card" id="summary"></section>

  <section class="card">
    <div class="rule-meta">
      <label for="ruleName">룰 이름</label><input id="ruleName">
      <label for="ruleMsg">룰 메시지</label><input id="ruleMsg">
      <label for="ruleUuid">룰 ID</label><input id="ruleUuid">
    </div>
  </section>

  <section class="card">
    <div class="tree-title">
      <h2>조건 트리</h2>
      <span class="legend">조건을 누르면 편집할 수 있습니다. 그룹의 AND/OR 버튼을 누르면 바뀝니다.</span>
    </div>
    <ul class="tree root" id="tree"></ul>
    <div class="rule-issues" id="ruleIssues"></div>
  </section>
</main>

let rule = null;          // { ruleUuid, ruleName, ruleMsg, root }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// 서버 형식(conditionTree) → 내부 트리
function fromServer(node) {
  if (node && Array.isArray(node.condition)) {
    return { id: ++seq, kind: "group", logicType: node.logicType || "AND",
      children: node.condition.map(fromServer) };
  }
  const n = { id: ++seq, kind: "cond", condUuid: node.condUuid || "", keyName: node.keyName || "",
    dispName: node.dispName || "", operator: node.operator || "", value: node.value ?? "",
    fieldDataType: node.fieldDataType || "String" };
  const m = /(\d+)$/.exec(n.condUuid);
  if (m) condSeq = Math.max(condSeq, +m[1]);
  return n;
}
// 내부 트리 → 서버 형식
function toServer(n) {
  if (n.kind === "group") return { logicType: n.logicType, condition: n.children.map(toServer) };
  return { condUuid: n.condUuid, keyName: n.keyName, dispName: n.dispName,
    operator: n.operator, value: n.value, fieldDataType: n.fieldDataType };
}
function buildRequest() {
  return [{ ruleUuid: rule.ruleUuid, ruleName: rule.ruleName, ruleMsg: rule.ruleMsg,
    conditionTree: toServer(rule.root) }];
}

function newCond() {
  condSeq += 1;
  return { id: ++seq, kind: "cond", condUuid: "cond-" + String(condSeq).padStart(3, "0"),
    keyName: "", dispName: "", operator: "==", value: "", fieldDataType: "String" };
}
function findNode(id, node = rule.root, parent = null) {
  if (node.id === id) return { node, parent };
  if (node.kind === "group") for (const c of node.children) {
    const r = findNode(id, c, node); if (r) return r;
  }
  return null;
}

function loadRule(data) {
  seq = 0; condSeq = 0; result = null; editingId = null;
  rule = { ruleUuid: data.ruleUuid || "rule-" + Date.now(), ruleName: data.ruleName || "",
    ruleMsg: data.ruleMsg || "", root: fromServer(data.conditionTree || { logicType: "AND", condition: [] }) };
  if (rule.root.kind !== "group") rule.root = { id: ++seq, kind: "group", logicType: "AND", children: [rule.root] };
  $("ruleName").value = rule.ruleName; $("ruleMsg").value = rule.ruleMsg; $("ruleUuid").value = rule.ruleUuid;
  renderSummary(); render();
}

// 트리가 바뀌면 이전 결과 표시는 낡은 것이므로 지움
function invalidate() { if (result) { result = null; renderSummary(); } }

// ---- 응답 매핑 ----
function issuesByUuid() {
  const map = {}; const unmatched = [];
  if (!result) return { map, unmatched };
  const uuids = new Set(); (function walk(n) { if (n.kind === "cond") uuids.add(n.condUuid); else n.children.forEach(walk); })(rule.root);
  for (const is of result.issues || []) {
    if (is.condUuid && uuids.has(is.condUuid)) (map[is.condUuid] ||= []).push(is);
    else unmatched.push(is);
  }
  return { map, unmatched };
}
function sevRank(list) {
  if (list.some((i) => i.severity === "error")) return "error";
  if (list.length) return "warning";
  return "";
}
function issueHtml(is) {
  const sev = is.severity === "error" ? "error" : "warning";
  return `<div class="issue ${sev}">
    <span class="badge ${sev}">${sev === "error" ? "오류" : "경고"}</span>
    <span class="itype">${esc(ISSUE_LABELS[is.issue_type] || is.issue_type)}</span>
    ${is.location ? `<span class="uuid">${esc(is.location)}</span>` : ""}
    <div>${esc(is.explanation)}</div>
    ${is.ai_explanation ? `<div class="ai">${esc(is.ai_explanation)}</div>` : ""}
    ${is.suggestion || is.ai_suggestion ? `<div class="sugg">${esc(is.ai_suggestion || is.suggestion)}</div>` : ""}
  </div>`;
}

// ---- 렌더링 ----
function render() {
  const { map, unmatched } = issuesByUuid();
  $("tree").innerHTML = `<li>${nodeHtml(rule.root, map, true)}</li>`;
  $("ruleIssues").innerHTML = result && unmatched.length
    ? `<h3 style="margin-top:14px">룰 전체에 대한 이슈</h3>${unmatched.map(issueHtml).join("")}` : "";
}
function nodeHtml(n, map, isRoot) {
  if (n.kind === "group") {
    const kids = n.children.length
      ? n.children.map((c) => `<li>${nodeHtml(c, map, false)}</li>`).join("")
      : `<li><span class="empty">비어 있는 그룹입니다. 조건을 추가하세요.</span></li>`;
    return `<div class="group ${n.logicType}">
        <button class="logic" data-act="toggle" data-id="${n.id}" title="AND/OR 전환">${n.logicType}</button>
        <span class="hint">${n.logicType === "AND" ? "모두 만족" : "하나라도 만족"}</span>
        <button class="small" data-act="addCond" data-id="${n.id}">+ 조건</button>
        <button class="small" data-act="addGroup" data-id="${n.id}">+ 그룹</button>
        ${isRoot ? "" : `<button class="small danger" data-act="del" data-id="${n.id}">삭제</button>`}
      </div>
      <ul class="tree">${kids}</ul>`;
  }
  const list = map[n.condUuid] || [];
  const sev = sevRank(list);
  const state = result ? (sev ? "has-" + sev : "clean") : "";
  const editing = editingId === n.id;
  const badge = !result ? "" : sev
    ? `<span class="badge ${sev}">${sev === "error" ? "오류" : "경고"} ${list.length}</span>`
    : `<span class="badge ok">통과</span>`;
  return `<div class="cond ${state} ${editing ? "editing" : ""}">
      <div class="cond-row" data-act="edit" data-id="${n.id}">
        <span class="uuid">${esc(n.condUuid)}</span>
        <span class="name">${esc(n.dispName || "(표시명 없음)")}</span>
        <span class="key">${esc(n.keyName)}</span>
        <span class="op">${esc(n.operator || "?")}</span>
        <span class="val">${esc(n.value === "" ? "(값 없음)" : n.value)}</span>
        <span class="type">${esc(n.fieldDataType)}</span>
        ${badge}
        <span class="row-actions"><button class="small danger" data-act="del" data-id="${n.id}">삭제</button></span>
      </div>
      <div class="editor">
        ${field(n, "dispName", "표시명")}
        ${field(n, "keyName", "키")}
        <label>연산자<input data-id="${n.id}" data-f="operator" list="ops" value="${esc(n.operator)}"></label>
        ${field(n, "value", "값")}
        <label>타입<select data-id="${n.id}" data-f="fieldDataType">
          ${TYPES.concat(TYPES.includes(n.fieldDataType) ? [] : [n.fieldDataType]).map((t) => `<option ${t === n.fieldDataType ? "selected" : ""}>${esc(t)}</option>`).join("")}
        </select></label>
      </div>
      ${list.length ? `<div class="issues">${list.map(issueHtml).join("")}</div>` : ""}
    </div>`;
}
function field(n, f, label) {
  return `<label>${label}<input data-id="${n.id}" data-f="${f}" value="${esc(n[f])}"></label>`;
}

function renderSummary() {
  const el = $("summary");
  if (!result) { el.className = "card"; el.innerHTML = ""; return; }
  el.className = "card show";
  if (result.__error) { el.innerHTML = `<div class="err-box">${esc(result.__error)}</div>`; return; }
  const counts = Object.entries(result.issue_counts || {});
  const q = result.quality_metrics;
  const errs = (result.issues || []).filter((i) => i.severity === "error").length;
  const warns = (result.issues || []).length - errs;
  el.innerHTML = `<div class="sum-head">
      <span class="verdict ${result.is_valid ? "ok" : "bad"}">${result.is_valid ? "유효" : "문제 있음"}</span>
      <span>${esc(result.summary)}</span>
    </div>
    <div class="chips">
      <span class="chip">오류<b>${errs}</b></span><span class="chip">경고<b>${warns}</b></span>
      ${counts.map(([k, v]) => `<span class="chip">${esc(ISSUE_LABELS[k] || k)}<b>${v}</b></span>`).join("")}
    </div>
    ${q ? `<div class="scores">
      <span>종합<strong>${q.overall_score}</strong></span><span>유지보수<strong>${q.maintainability_score}</strong></span>
      <span>가독성<strong>${q.readability_score}</strong></span><span>완전성<strong>${q.completeness_score}</strong></span>
      <span>일관성<strong>${q.consistency_score}</strong></span></div>` : ""}
    ${result.ai_comment ? `<div class="ai-comment">${esc(result.ai_comment)}</div>` : ""}`;
}

// ---- 이벤트 ----
$("tree").addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const id = +t.dataset.id; const act = t.dataset.act;
  const found = findNode(id); if (!found) return;
  const { node, parent } = found;
  if (act === "edit") { editingId = editingId === id ? null : id; render(); focusEditor(); return; }
  e.stopPropagation();
  if (act === "toggle") node.logicType = node.logicType === "AND" ? "OR" : "AND";
  if (act === "addCond") { const c = newCond(); node.children.push(c); editingId = c.id; }
  if (act === "addGroup") { const c = newCond(); node.children.push({ id: ++seq, kind: "group", logicType: node.logicType === "AND" ? "OR" : "AND", children: [c] }); editingId = c.id; }
  if (act === "del" && parent) { parent.children = parent.children.filter((c) => c.id !== id); if (editingId === id) editingId = null; }
  invalidate(); render(); focusEditor();
});
function focusEditor() {
  const inp = document.querySelector(".cond.editing .editor input"); if (inp) inp.focus();
}
$("tree").addEventListener("input", (e) => {
  const t = e.target; if (!t.dataset.f) return;
  const { node } = findNode(+t.dataset.id); node[t.dataset.f] = t.value;
  // 요약 줄만 갱신(입력 포커스 유지)
  const row = t.closest(".cond").querySelector(".cond-row");
  row.querySelector(".name").textContent = node.dispName || "(표시명 없음)";
  row.querySelector(".key").textContent = node.keyName;
  row.querySelector(".op").textContent = node.operator || "?";
  row.querySelector(".val").textContent = node.value === "" ? "(값 없음)" : node.value;
  row.querySelector(".type").textContent = node.fieldDataType;
  if (result) { invalidate(); const keep = t.dataset.f; const id = t.dataset.id; render();
    const again = document.querySelector(`.editor [data-id="${id}"][data-f="${keep}"]`); if (again) { again.focus(); again.selectionStart = again.selectionEnd = again.value.length; } }
});
["ruleName", "ruleMsg", "ruleUuid"].forEach((k) => $(k).addEventListener("input", (e) => { rule[k] = e.target.value; invalidate(); }));

$("sample").innerHTML = Object.keys(SAMPLES).map((k) => `<option value="${k}">${esc(SAMPLE_LABELS[k] || k)}</option>`).join("");
$("sample").addEventListener("change", (e) => loadRule(SAMPLES[e.target.value][0]));
$("btnNew").addEventListener("click", () => loadRule({ ruleName: "새 룰", ruleMsg: "", conditionTree: { logicType: "AND", condition: [] } }));

const base = () => $("server").value.trim().replace(/\/+$/, "");
$("btnPing").addEventListener("click", async () => {
  const c = $("conn"); c.className = "conn"; c.textContent = "확인 중";
  try { const r = await fetch(base() + "/health"); c.className = "conn " + (r.ok ? "ok" : "bad"); c.textContent = r.ok ? "연결됨" : "응답 " + r.status; }
  catch { c.className = "conn bad"; c.textContent = "연결 실패"; }
});

$("btnValidate").addEventListener("click", async () => {
  const btn = $("btnValidate"); btn.disabled = true; btn.textContent = "검증 중…";
  try {
    const r = await fetch(base() + "/rules/validate-json", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(buildRequest()) });
    const body = await r.json().catch(() => null);
    if (!r.ok) {
      const d = body && body.detail; const msg = typeof d === "string" ? d : (d && (d.message || d.error)) || r.statusText;
      result = { __error: `서버가 ${r.status} 응답을 보냈습니다: ${msg}` };
    } else result = body;
    $("conn").className = "conn ok"; $("conn").textContent = "연결됨";
  } catch (err) {
    result = { __error: `서버에 연결하지 못했습니다 (${base()}). 백엔드가 켜져 있는지 확인하세요.\n${err.message}` };
    $("conn").className = "conn bad"; $("conn").textContent = "연결 실패";
  }
  btn.disabled = false; btn.textContent = "검증";
  renderSummary(); render();
  $("summary").scrollIntoView({ behavior: "smooth", block: "start" });
});

document.body.insertAdjacentHTML("beforeend", `<datalist id="ops">${OPERATORS.map((o) => `<option value="${esc(o)}">`).join("")}</datalist>`);
loadRule(SAMPLES[Object.keys(SAMPLES)[0]][0]);
</script>
</body>
