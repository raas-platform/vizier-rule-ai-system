<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vizier 룰 디자인 테스트</title>
<style>
  :root {
    --bg: #f4f6fa; --panel: #fff; --line: #d7dce5; --wire: #9aa5b8; --text: #1f2633; --muted: #6b7486;
    --and: #2f6fde; --and-bg: #e8f0fd; --or: #c06a12; --or-bg: #fdf1e3;
    --err: #d23c3c; --err-bg: #fdecec; --warn: #b7860b; --warn-bg: #fdf6df;
    --ok: #1f9a5a; --ok-bg: #e5f6ec; --accent: #3557d6; --ai: #6a4fe0; --ai-bg: #f4f1fe;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  header { background: #1e2a44; color: #fff; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 16px 0 0; font-weight: 700; }
  header label { font-size: 12px; opacity: .8; }
  header input, header select { padding: 6px 8px; border-radius: 6px; border: 1px solid #44527a; background: #2a3858; color: #fff; font: inherit; }
  header input { width: 220px; }
  .conn { font-size: 12px; padding: 3px 8px; border-radius: 10px; background: #44527a; }
  .conn.ok { background: var(--ok); } .conn.bad { background: var(--err); }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--text); padding: 5px 10px; white-space: nowrap; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:disabled:hover { border-color: var(--line); color: var(--text); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; padding: 7px 18px; }
  button.primary:hover { background: #2846b8; color: #fff; }
  button.primary:disabled { opacity: .6; cursor: wait; }
  button.ghost { background: transparent; color: #cfd6e6; border-color: #44527a; }
  button.small { font-size: 12px; padding: 3px 9px; }
  button.danger { color: var(--err); }
  button.danger:hover { border-color: var(--err); }
  .spacer { flex: 1; }
  main { padding: 16px 20px 60px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .rule-meta { display: grid; grid-template-columns: 70px 1fr 70px 1fr 50px 200px; gap: 6px 10px; align-items: center; }
  .rule-meta label { color: var(--muted); font-size: 12px; }
  .rule-meta input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .err-box { padding: 10px 12px; background: var(--err-bg); color: var(--err); border-radius: 6px; white-space: pre-wrap; font-size: 13px; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: 13px; }

  /* 작업 영역: 가운데 트리 + 오른쪽 AI 패널 (Vizier 배치) */
  .work { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 14px; align-items: start; }
  .work.wide { grid-template-columns: minmax(0, 1fr) minmax(420px, 55%); }
  .canvas-card { padding: 0; overflow: hidden; }
  .canvas-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .canvas-head h2 { font-size: 15px; margin: 0; white-space: nowrap; }
  .canvas-head .legend { font-size: 12px; color: var(--muted); }
  .zoom { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .zoom #zoomVal { min-width: 38px; text-align: center; }
  .canvas { overflow: auto; padding: 24px 16px 32px; background:
      radial-gradient(circle, #dfe4ec 1px, transparent 1px) 0 0 / 18px 18px; min-height: 240px; }

  /* 위→아래 조직도형 트리 */
  .org, .org ul { display: flex; justify-content: center; margin: 0; padding: 0; list-style: none; }
  .org { width: max-content; min-width: 100%; }
  .org ul { padding-top: 22px; position: relative; }
  .org li { display: flex; flex-direction: column; align-items: center; position: relative; padding: 22px 8px 0; }
  .org > li { padding-top: 0; }
  .org li::before, .org li::after { content: ""; position: absolute; top: 0; width: 50%; height: 22px; border-top: 2px solid var(--wire); }
  .org li::before { right: 50%; }
  .org li::after { left: 50%; border-left: 2px solid var(--wire); }
  .org li:only-child::before, .org li:only-child::after { display: none; }
  .org li:only-child { padding-top: 0; }
  .org li:first-child::before, .org li:last-child::after { border: 0 none; }
  .org li:last-child::before { border-right: 2px solid var(--wire); border-radius: 0 8px 0 0; }
  .org li:first-child::after { border-radius: 8px 0 0 0; }
  .org > li::before, .org > li::after { display: none; }
  .org ul::before { content: ""; position: absolute; top: 0; left: 50%; height: 22px; border-left: 2px solid var(--wire); }

  .node { position: relative; cursor: pointer; border-radius: 10px; background: #fff; border: 2px solid var(--line);
    box-shadow: 0 1px 2px rgba(20, 30, 50, .06); transition: box-shadow .12s, transform .12s; }
  .node:hover { box-shadow: 0 4px 12px rgba(20, 30, 50, .12); }
  .node.selected { outline: 3px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 6px rgba(53, 87, 214, .15); }
  .gnode { padding: 6px 14px; text-align: center; font-weight: 800; }
  .gnode.AND { background: var(--and-bg); border-color: var(--and); color: var(--and); }
  .gnode.OR { background: var(--or-bg); border-color: var(--or); color: var(--or); }
  .gnode small { display: block; font-weight: 500; font-size: 11px; opacity: .85; }
  .cnode { width: 150px; padding: 8px 10px; text-align: left; }
  .cnode .uuid { font-size: 10px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cnode .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cnode .expr { font-size: 12px; margin-top: 2px; display: flex; gap: 4px; align-items: baseline; min-width: 0; }
  .cnode .key { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .cnode .op { font-family: ui-monospace, Consolas, monospace; font-weight: 700; color: var(--accent); flex: none; }
  .cnode .val { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .cnode .type { position: absolute; top: 6px; right: 8px; font-size: 10px; padding: 0 5px; border-radius: 4px; background: #eef1f6; color: #4b5568; }
  .node.has-error { border-color: var(--err); background: #fff5f5; }
  .node.has-warning { border-color: var(--warn); background: #fffcf0; }
  .node.clean { border-color: #7fcca2; }
  .node .pin { position: absolute; top: -11px; right: -9px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 9px; white-space: nowrap; }
  .badge.error { background: var(--err); color: #fff; } .badge.warning { background: var(--warn); color: #fff; } .badge.ok { background: var(--ok); color: #fff; }
  .empty-slot { font-size: 12px; color: var(--muted); border: 2px dashed var(--line); border-radius: 10px; padding: 8px 12px; background: #fff; }

  /* 트리 아래 편집 영역 */
  .editor { border-top: 1px solid var(--line); padding: 12px 14px 14px; background: #fafbfd; }
  .editor h3 { font-size: 13px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .form { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .form label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
  .form input, .form select { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--text); min-width: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 16px; font-weight: 800; }
  .seg button.on.AND { background: var(--and); color: #fff; } .seg button.on.OR { background: var(--or); color: #fff; }

  /* AI 패널 */
  .ai-panel { position: sticky; top: 12px; padding: 0; display: flex; flex-direction: column;
    max-height: calc(100vh - 24px); min-height: 360px; overflow: hidden; }
  .ai-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--ai-bg); }
  .ai-head h2 { font-size: 15px; margin: 0; color: var(--ai); white-space: nowrap; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .tabs button { border: 0; border-radius: 0; padding: 4px 12px; font-size: 13px; }
  .tabs button.on { background: var(--ai); color: #fff; font-weight: 700; }
  .tabs button.on:hover { color: #fff; }
  .ai-body { overflow: auto; flex: 1; min-height: 0; }
  .ai-empty { padding: 28px 18px; text-align: center; color: var(--muted); font-size: 13px; }
  .ai-empty b { display: block; color: var(--text); font-size: 14px; margin-bottom: 4px; }
  .ai-sum { padding: 4px 16px 10px; }
  .ai-sep { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); padding: 0 16px; margin-top: 4px; }
  .ai-sep::before, .ai-sep::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
  .ai-detail { padding: 4px 16px 14px; }
  .ai-detail.empty { color: var(--muted); font-size: 13px; padding-top: 10px; }
  .ai-foot { border-top: 1px solid var(--line); padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: #fff; }
  .ai-foot .hint { font-size: 12px; color: var(--muted); }
  #btnReport { font-weight: 700; color: var(--ai); border-color: var(--ai); }
  #btnReport:hover:not(:disabled) { background: var(--ai); color: #fff; }
  #btnReport:disabled { color: var(--muted); border-color: var(--line); }

  /* 패널 안 markdown */
  .mdv { overflow-wrap: anywhere; font-size: 13.5px; }
  .mdv h1 { font-size: 20px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .mdv h2 { font-size: 17px; margin: 12px 0 6px; }
  .mdv h3 { font-size: 14.5px; margin: 14px 0 6px; }
  .mdv p { margin: 6px 0; }
  .mdv ul { padding-left: 20px; margin: 6px 0; }
  .mdv li { margin: 3px 0; }
  .mdv em { font-style: normal; font-weight: 700; color: #4a3fa0; }
  .mdv code { background: #eef1f6; padding: 1px 5px; border-radius: 4px; font: 12.5px ui-monospace, Consolas, monospace; }
  .mdv table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
  .mdv th, .mdv td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; }
  .mdv blockquote { margin: 10px 0 4px; padding: 8px 12px; background: #f6f7fb; border-left: 3px solid var(--ai); border-radius: 6px; }
  .mdv blockquote p { margin: 4px 0; }
  .mdv blockquote p:last-child { font-size: 12px; color: var(--muted); }
  .mdv hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
  .mdv pre.raw { white-space: pre-wrap; font: 12.5px/1.6 ui-monospace, Consolas, monospace; margin: 12px 0; }
  .ai-detail.mdv h3:first-child { margin-top: 8px; }

  /* 패널 안 리포트 */
  .rp-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .rp-status { font-size: 12px; color: var(--muted); }
  .rp-status.bad { color: var(--err); font-weight: 700; } .rp-status.ok { color: var(--ok); font-weight: 700; }
  .rp-pick { padding: 22px 16px; display: grid; gap: 12px; }
  .rp-pick .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rp-pick .opts button { padding: 14px; text-align: left; border-radius: 10px; white-space: normal; }
  .rp-pick .opts b { display: block; font-size: 15px; margin-bottom: 4px; }
  .rp-pick .opts span { font-size: 12px; color: var(--muted); }
  .rp-pick .key { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .rp-pick .key input { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; flex: 1; min-width: 140px; }
  .rp-doc { padding: 4px 16px 16px; }
  .rp-err { margin: 10px 12px 0; }
  .rp-frame { display: block; width: 100%; border: 0; min-height: 300px; background: #f3f4f6; }
  .rp-metrics { font-size: 11.5px; color: var(--muted); padding: 6px 12px; border-top: 1px solid var(--line); background: #fff; }
  .rp-metrics:empty { display: none; }
  .progress { height: 3px; background: linear-gradient(90deg, transparent, var(--ai), transparent); background-size: 40% 100%;
    background-repeat: no-repeat; animation: slide 1.2s linear infinite; }
  @keyframes slide { from { background-position: -40% 0; } to { background-position: 140% 0; } }
  .cursor::after { content: "▍"; color: var(--ai); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  @media (max-width: 1000px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    header input { width: 100%; }
    .work, .work.wide { grid-template-columns: 1fr; }
    .ai-panel { position: static; max-height: none; }
    .rule-meta { grid-template-columns: 70px 1fr; }
    .form { grid-template-columns: 1fr 1fr; }
    #btnWide { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Vizier 룰 디자인 · 로컬 테스트</h1>
  <label for="server">서버</label>
  <input id="server" value="http://localhost:8000">
  <button class="ghost small" id="btnPing">연결 확인</button>
  <span class="conn" id="conn">미확인</span>
  <span class="spacer"></span>
  <label for="sample">샘플</label>
  <select id="sample"></select>
  <button class="ghost small" id="btnNew">새 룰</button>
  <button class="primary" id="btnValidate">검증</button>
</header>

<main>
  <section class="card">
    <div class="rule-meta">
      <label for="ruleName">룰 이름</label><input id="ruleName">
      <label for="ruleMsg">룰 메시지</label><input id="ruleMsg">
      <label for="ruleUuid">룰 ID</label><input id="ruleUuid">
    </div>
  </section>

  <div class="work" id="work">
    <section class="card canvas-card">
      <div class="canvas-head">
        <h2>조건 트리</h2>
        <span class="legend">조건을 누르면 오른쪽 AI 패널에 설명이 나옵니다. 편집은 트리 아래에서 합니다.</span>
        <span class="spacer"></span>
        <span class="zoom">
          <button class="small" id="zoomOut" title="축소">−</button>
          <span id="zoomVal">100%</span>
          <button class="small" id="zoomIn" title="확대">+</button>
          <button class="small" id="zoomFit" title="트리 전체를 한 화면에">맞춤</button>
        </span>
      </div>
      <div class="canvas" id="canvas"><ul class="org" id="tree"></ul></div>
      <div class="editor" id="editor"></div>
    </section>

    <aside class="card ai-panel" id="aiPanel" aria-label="AI 패널">
      <div class="ai-head">
        <h2>AI Report</h2>
        <span class="spacer"></span>
        <div class="tabs" role="tablist">
          <button id="tabSum" class="on" role="tab">검증 요약</button>
          <button id="tabRp" role="tab" disabled>리포트</button>
        </div>
        <button class="small" id="btnWide" title="패널 폭 넓히기/줄이기">넓게</button>
      </div>

      <!-- 검증 요약 + 선택한 조건 설명 -->
      <div class="ai-body" id="sumView">
        <div id="aiSummary"></div>
        <div id="aiDetailWrap"></div>
      </div>
      <div class="ai-foot" id="sumFoot">
        <button id="btnReport" disabled>리포트</button>
        <span class="hint" id="reportHint">검증한 뒤에 만들 수 있습니다</span>
      </div>

      <!-- 리포트 -->
      <div class="rp-bar" id="rpBar" hidden>
        <span class="rp-status" id="rpStatus"></span>
        <span class="spacer"></span>
        <button class="small" id="rpRaw" hidden>원문 보기</button>
        <button class="small danger" id="rpStop" hidden>중지</button>
        <button class="small" id="rpAgain" hidden>다른 형식으로</button>
        <button class="small primary" id="rpDownload" hidden>다운로드</button>
      </div>
      <div class="progress" id="rpProgress" hidden></div>
      <div class="ai-body" id="rpBody" hidden></div>
      <div class="rp-metrics" id="rpMetrics" hidden></div>
    </aside>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>

// ---- 상태 ----
let rule = null;        // { ruleUuid, ruleName, ruleMsg, root }
let result = null;      // 마지막 서버 응답

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// markdown → HTML. raw HTML은 그리지 않고 글자로 보여 줌(스펙 2). 그 위에 DOMPurify로 한 번 더 거름.
if (window.marked) {
  marked.use({ gfm: true, breaks: true, renderer: { html(t) { return esc(typeof t === "string" ? t : (t && t.text) || ""); } } });
}
function mdHtml(src) {
  if (!window.marked || !window.DOMPurify) return `<pre class="raw">${esc(src)}</pre>`;
  return DOMPurify.sanitize(marked.parse(src || ""));
}

// 서버 형식(conditionTree) ↔ 내부 트리
function fromServer(node) {
  if (node && Array.isArray(node.condition)) {
    return { id: ++seq, kind: "group", logicType: node.logicType || "AND", children: node.condition.map(fromServer) };
  }
  const n = { id: ++seq, kind: "cond", condUuid: node.condUuid || "", keyName: node.keyName || "",
    dispName: node.dispName || "", operator: node.operator || "", value: node.value ?? "",
    fieldDataType: node.fieldDataType || "String" };
  const m = /^cond-(\d+)$/.exec(n.condUuid);
  if (m) condSeq = Math.max(condSeq, +m[1]);
  return n;
}
function toServer(n) {
  if (n.kind === "group") return { logicType: n.logicType, condition: n.children.map(toServer) };
  return { condUuid: n.condUuid, keyName: n.keyName, dispName: n.dispName,
    operator: n.operator, value: n.value, fieldDataType: n.fieldDataType };
}
function buildRequest() {
  return [{ ruleUuid: rule.ruleUuid, ruleName: rule.ruleName, ruleMsg: rule.ruleMsg, conditionTree: toServer(rule.root) }];
}
function newCond() {
  condSeq += 1;
  return { id: ++seq, kind: "cond", condUuid: "cond-" + String(condSeq).padStart(3, "0"),
    keyName: "", dispName: "", operator: "==", value: "", fieldDataType: "String" };
}
function findNode(id, node = rule.root, parent = null) {
  if (node.id === id) return { node, parent };
  if (node.kind === "group") for (const c of node.children) { const r = findNode(id, c, node); if (r) return r; }
  return null;
}
function condByUuid(uuid, node = rule.root) {
  if (node.kind === "cond") return node.condUuid === uuid ? node : null;
  for (const c of node.children) { const r = condByUuid(uuid, c); if (r) return r; }
  return null;
}

function loadRule(data) {
  stopReport(); seq = 0; condSeq = 0; result = null; validated = null; resetReport();
  rule = { ruleUuid: data.ruleUuid || "rule-" + Date.now(), ruleName: data.ruleName || "",
    ruleMsg: data.ruleMsg || "", root: fromServer(data.conditionTree || { logicType: "AND", condition: [] }) };
  if (rule.root.kind !== "group") rule.root = { id: ++seq, kind: "group", logicType: "AND", children: [rule.root] };
  selectedId = rule.root.id;
  $("ruleName").value = rule.ruleName; $("ruleMsg").value = rule.ruleMsg; $("ruleUuid").value = rule.ruleUuid;
  setTab("sum"); renderAll(); fitZoom(); centerOn(rule.root.id);
}
// 트리가 바뀌면 이전 결과·리포트는 낡은 것이므로 지움 → 리포트 버튼 비활성(스펙 5)
function invalidate() {
  const had = !!(result || validated);
  validated = null; result = null;
  if (had) { stopReport(); resetReport(); setTab("sum"); renderAi(true); }
}

// ---- 응답 매핑 (트리 표시용) ----
function issueIndex() {
  const map = {};
  for (const is of (result && result.issues) || []) {
    if (is.condUuid && condByUuid(is.condUuid)) (map[is.condUuid] ||= []).push(is);
  }
  return map;
}
const sevOf = (list) => list.some((i) => i.severity === "error") ? "error" : list.length ? "warning" : "";

// ---- 렌더링 ----
function renderAll() { renderTree(); renderEditor(); renderAi(); }

let zoom = 1;
function setZoom(z) { zoom = Math.min(1.5, Math.max(0.3, Math.round(z * 100) / 100)); $("tree").style.zoom = zoom; $("zoomVal").textContent = Math.round(zoom * 100) + "%"; }
function fitZoom(min = 0.65) {
  setZoom(1); const c = $("canvas"); const avail = c.clientWidth - 32; const w = $("tree").scrollWidth;
  setZoom(w > avail ? Math.max(min, avail / w) : 1);
}
$("zoomIn").addEventListener("click", () => setZoom(zoom + 0.1));
$("zoomOut").addEventListener("click", () => setZoom(zoom - 0.1));
$("zoomFit").addEventListener("click", () => { fitZoom(0.3); centerOn(rule.root.id); });

function centerOn(id) {
  const c = $("canvas"); const el = c.querySelector(`.node[data-id="${id}"]`); if (!el) return;
  const cr = c.getBoundingClientRect(), er = el.getBoundingClientRect();
  c.scrollLeft += (er.left + er.width / 2) - (cr.left + cr.width / 2);
}

function renderTree() {
  $("tree").innerHTML = `<li>${nodeHtml(rule.root, issueIndex())}</li>`;
}
function nodeHtml(n, map) {
  const sel = n.id === selectedId ? "selected" : "";
  if (n.kind === "group") {
    const kids = n.children.length
      ? n.children.map((c) => `<li>${nodeHtml(c, map)}</li>`).join("")
      : `<li><div class="empty-slot">조건 없음</div></li>`;
    return `<div class="node gnode ${n.logicType} ${sel}" data-id="${n.id}" title="그룹 선택">
        ${n.logicType}<small>${n.logicType === "AND" ? "모두 만족" : "하나라도 만족"}</small></div>
      <ul>${kids}</ul>`;
  }
  const list = map[n.condUuid] || [];
  const sev = sevOf(list);
  const state = result && !result.__error ? (sev ? "has-" + sev : "clean") : "";
  // Vizier처럼 이슈가 있는 조건에 경고 아이콘 + 빨간(경고만 있으면 노란) 표시. 설명 글은 노드에 넣지 않음
  const pin = !state ? "" : sev
    ? `<span class="pin badge ${sev}" title="${sev === "error" ? "오류" : "경고"} ${list.length}건">⚠ ${list.length}</span>`
    : `<span class="pin badge ok">통과</span>`;
  return `<div class="node cnode ${state} ${sel}" data-id="${n.id}" title="${esc(n.dispName)} ${esc(n.keyName)} ${esc(n.operator)} ${esc(n.value)}">
      ${pin}<span class="type">${esc(n.fieldDataType)}</span>
      <div class="uuid">${esc(n.condUuid)}</div>
      <div class="name">${esc(n.dispName || "(표시명 없음)")}</div>
      <div class="expr"><span class="key">${esc(n.keyName || "키?")}</span><span class="op">${esc(n.operator || "?")}</span><span class="val">${esc(n.value === "" ? "값?" : n.value)}</span></div>
    </div>`;
}

// 트리 아래 편집 영역 (검증 결과는 AI 패널에만)
function renderEditor() {
  const p = $("editor");
  const found = selectedId && findNode(selectedId);
  if (!found) { p.innerHTML = `<p class="muted">트리에서 박스를 선택하면 여기서 편집합니다.</p>`; return; }
  const { node, parent } = found;
  if (node.kind === "group") {
    p.innerHTML = `<h3>그룹 편집 ${parent ? "" : "<span class='muted'>(최상위)</span>"}</h3>
      <div class="actions" style="margin-top:0">
        <div class="seg">
          <button class="AND ${node.logicType === "AND" ? "on" : ""}" data-act="logic" data-v="AND">AND</button>
          <button class="OR ${node.logicType === "OR" ? "on" : ""}" data-act="logic" data-v="OR">OR</button>
        </div>
        <span class="muted">${node.logicType === "AND" ? "아래 조건을 모두 만족해야 합니다." : "아래 조건 중 하나만 만족하면 됩니다."} 하위 항목 ${node.children.length}개</span>
        <span class="spacer"></span>
        <button class="small" data-act="addCond">+ 조건 추가</button>
        <button class="small" data-act="addGroup">+ 하위 그룹 추가</button>
        ${parent ? `<button class="small danger" data-act="del">그룹 삭제</button>` : ""}
      </div>`;
    return;
  }
  const typeOpts = TYPES.concat(TYPES.includes(node.fieldDataType) ? [] : [node.fieldDataType]);
  p.innerHTML = `<h3>조건 편집 <span class="muted">${esc(node.condUuid)}</span></h3>
    <div class="form" data-node="${node.id}">
      <label>표시명<input data-f="dispName" value="${esc(node.dispName)}"></label>
      <label>키<input data-f="keyName" value="${esc(node.keyName)}"></label>
      <label>연산자<input data-f="operator" list="ops" value="${esc(node.operator)}"></label>
      <label>값<input data-f="value" value="${esc(node.value)}"></label>
      <label>타입<select data-f="fieldDataType">${typeOpts.map((t) => `<option ${t === node.fieldDataType ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>
    </div>
    <div class="actions">
      <button class="small" data-act="addSibling">+ 같은 그룹에 조건 추가</button>
      <button class="small danger" data-act="del">조건 삭제</button>
    </div>`;
}

// AI 패널: 위 = 서버 ai_summary_md, 아래 = 선택한 조건의 condition_details_md[condUuid]
function renderAi(changed = false) {
  const ok = !!(result && !result.__error && validated);
  $("btnReport").disabled = !ok; $("tabRp").disabled = !ok && !RP.fmt;
  $("reportHint").textContent = ok ? "검증 결과로 MD/HTML 리포트를 만듭니다"
    : changed ? "트리가 바뀌었습니다. 다시 검증하면 켜집니다" : "검증한 뒤에 만들 수 있습니다";
  const sum = $("aiSummary"), det = $("aiDetailWrap");
  if (!result) {
    sum.innerHTML = changed
      ? `<div class="ai-empty"><b>트리가 바뀌었습니다</b>이전 검증 결과는 지웠습니다. 다시 검증을 눌러 주세요.</div>`
      : `<div class="ai-empty"><b>아직 검증하지 않았습니다</b>위쪽 검증 버튼을 누르면 여기에 AI 검증 요약이 나옵니다.</div>`;
    det.innerHTML = ""; return;
  }
  if (result.__error) { sum.innerHTML = `<div style="padding:14px 16px"><div class="err-box">${esc(result.__error)}</div></div>`; det.innerHTML = ""; return; }
  sum.innerHTML = typeof result.ai_summary_md === "string" && result.ai_summary_md
    ? `<div class="ai-sum mdv">${mdHtml(result.ai_summary_md)}</div>`
    : `<div style="padding:14px 16px"><div class="err-box">서버 응답에 ai_summary_md가 없습니다. 서버가 이 화면과 같은 버전인지 확인하세요.</div></div>`;
  renderDetail();
}
function renderDetail() {
  const det = $("aiDetailWrap");
  if (!result || result.__error) { det.innerHTML = ""; return; }
  const found = selectedId && findNode(selectedId);
  const node = found && found.node;
  if (!node || node.kind !== "cond") {
    det.innerHTML = `<div class="ai-sep">조건 설명</div><div class="ai-detail empty">트리에서 조건을 누르면 여기에 그 조건의 설명이 나옵니다.</div>`;
    return;
  }
  const md = (result.condition_details_md || {})[node.condUuid];
  det.innerHTML = `<div class="ai-sep">선택한 조건</div>` + (md
    ? `<div class="ai-detail mdv">${mdHtml(md)}</div>`
    : `<div class="ai-detail empty">서버 응답에 이 조건(${esc(node.condUuid || "condUuid 없음")})의 설명이 없습니다.</div>`);
}

function setTab(t) {
  tab = t;
  $("tabSum").classList.toggle("on", t === "sum"); $("tabRp").classList.toggle("on", t === "rp");
  $("sumView").hidden = t !== "sum"; $("sumFoot").hidden = t !== "sum";
  ["rpBar", "rpBody", "rpMetrics"].forEach((id) => { $(id).hidden = t !== "rp"; });
  $("rpProgress").hidden = t !== "rp" || !RP.ctrl;
  if (t === "rp") $("rpMetrics").hidden = !$("rpMetrics").textContent;
}

// ---- 이벤트 ----
function select(id) {
  selectedId = id; renderTree(); renderEditor(); renderDetail();
  // 조건을 누르면 요약 + 그 조건 설명이 보이도록 요약 탭으로(리포트 작성은 뒤에서 계속)
  const f = findNode(id);
  if (f && f.node.kind === "cond" && tab !== "sum") setTab("sum");
  const d = document.querySelector("#aiDetailWrap .ai-sep");
  if (d && f && f.node.kind === "cond") d.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
$("tree").addEventListener("click", (e) => { const t = e.target.closest(".node"); if (t) select(+t.dataset.id); });

$("editor").addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const { node, parent } = findNode(selectedId);
  const act = t.dataset.act;
  if (act === "logic") node.logicType = t.dataset.v;
  if (act === "addCond") { const c = newCond(); node.children.push(c); selectedId = c.id; }
  if (act === "addSibling") { const c = newCond(); parent.children.splice(parent.children.indexOf(node) + 1, 0, c); selectedId = c.id; }
  if (act === "addGroup") { const c = newCond();
    node.children.push({ id: ++seq, kind: "group", logicType: node.logicType === "AND" ? "OR" : "AND", children: [c] }); selectedId = c.id; }
  if (act === "del" && parent) { parent.children = parent.children.filter((c) => c !== node); selectedId = parent.id; }
  invalidate(); renderTree(); renderEditor(); renderDetail(); if (act !== "logic") centerOn(selectedId);
  const first = document.querySelector("#editor .form input"); if (first && act !== "logic") first.focus();
});
function onField(e) {
  const t = e.target; if (!t.dataset.f) return;
  const found = findNode(+t.closest("[data-node]").dataset.node); if (!found) return;
  found.node[t.dataset.f] = t.value;
  invalidate(); renderTree(); // 입력 칸은 다시 그리지 않아 포커스 유지
}
$("editor").addEventListener("input", onField);
["ruleName", "ruleMsg", "ruleUuid"].forEach((k) => $(k).addEventListener("input", (e) => { rule[k] = e.target.value; invalidate(); renderTree(); }));

$("sample").addEventListener("change", (e) => loadRule(SAMPLES[e.target.value][0]));
$("btnNew").addEventListener("click", () => {
  const c = { condUuid: "cond-001", keyName: "", dispName: "", operator: "==", value: "", fieldDataType: "String" };
  loadRule({ ruleName: "새 룰", ruleMsg: "", conditionTree: { logicType: "AND", condition: [c] } });
  select(rule.root.children[0].id);
});
$("tabSum").addEventListener("click", () => setTab("sum"));
$("tabRp").addEventListener("click", () => { if (!$("tabRp").disabled) { if (!RP.fmt && !RP.ctrl) openReport(); setTab("rp"); } });
$("btnWide").addEventListener("click", () => {
  const w = $("work").classList.toggle("wide"); $("btnWide").textContent = w ? "좁게" : "넓게";
  setTimeout(() => { fitZoom(); centerOn(selectedId); flushHtml(); }, 0);
});

const base = () => $("server").value.trim().replace(/\/+$/, "");
function setConn(ok, text) { $("conn").className = "conn " + (ok ? "ok" : "bad"); $("conn").textContent = text; }
$("btnPing").addEventListener("click", async () => {
  $("conn").className = "conn"; $("conn").textContent = "확인 중";
  try { const r = await fetch(base() + "/health"); setConn(r.ok, r.ok ? "연결됨" : "응답 " + r.status); }
  catch { setConn(false, "연결 실패"); }
});
$("btnValidate").addEventListener("click", async () => {
  const btn = $("btnValidate"); btn.disabled = true; btn.textContent = "검증 중…";
  stopReport(); resetReport(); setTab("sum");
  try {
    const req = buildRequest(); // 리포트에는 실제로 검증한 룰을 보냄
    const r = await fetch(base() + "/rules/validate-json", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(req) });
    const body = await r.json().catch(() => null);
    if (!r.ok) {
      const d = body && body.detail;
      const msg = typeof d === "string" ? d : (d && (d.message || d.error)) || r.statusText;
      result = { __error: `서버가 ${r.status} 응답을 보냈습니다: ${msg}` };
    } else { result = body; validated = { rule: req[0], at: new Date() }; }
    setConn(true, "연결됨");
  } catch (err) {
    result = { __error: `서버에 연결하지 못했습니다 (${base()}). 백엔드가 켜져 있는지 확인하세요.\n${err.message}` };
    setConn(false, "연결 실패");
  }
  btn.disabled = false; btn.textContent = "검증";
  // 조건을 선택하고 있었다면 그대로 두고, 그룹을 선택 중이면 문제가 있는 첫 조건으로 이동
  const firstBad = result && result.issues && result.issues.map((i) => i.condUuid && condByUuid(i.condUuid)).find(Boolean);
  const cur = selectedId && findNode(selectedId);
  if (firstBad && !(cur && cur.node.kind === "cond")) selectedId = firstBad.id;
  renderAll(); centerOn(selectedId); $("sumView").scrollTop = 0;
});


// ---- 리포트 (AI 패널 안, POST /rules/report/stream) ----
const RP = { fmt: null, raw: "", done: false, ctrl: null, showRaw: false, t0: 0, tFirst: 0, headSkipped: false,
  writtenHtml: 0, timer: null, tick: null, shown: false, mdQueued: false, doc: null, followTail: true };
const lsGet = (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* 무시 */ } };
function rpStatus(text, cls = "") { $("rpStatus").className = "rp-status " + cls; $("rpStatus").textContent = text; }
function rpButtons({ stop = false, download = false, again = false, raw = false }) {
  $("rpStop").hidden = !stop; $("rpDownload").hidden = !download; $("rpAgain").hidden = !again; $("rpRaw").hidden = !raw;
}
function setMetrics(text) { $("rpMetrics").textContent = text; $("rpMetrics").hidden = tab !== "rp" || !text; }
function pad2(n) { return String(n).padStart(2, "0"); }
function stamp(d) { return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}`; }
function reportFileName() {
  const name = (validated.rule.ruleName || "룰").trim().replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 60) || "룰";
  return `${name}_검증리포트_${stamp(validated.at)}.${RP.fmt}`;
}
function stopReport() { if (RP.ctrl) RP.ctrl.abort(); clearInterval(RP.timer); clearInterval(RP.tick); }
function resetReport() {
  Object.assign(RP, { fmt: null, raw: "", done: false, doc: null, ctrl: null });
  $("rpBody").innerHTML = ""; setMetrics(""); rpStatus(""); rpButtons({}); $("rpProgress").hidden = true;
}
function openReport() {
  if ($("btnReport").disabled) return;
  RP.fmt = null; rpButtons({}); setMetrics(""); rpStatus("형식을 고르세요");
  $("rpBody").innerHTML = `<div class="rp-pick">
      <div class="opts">
        <button data-fmt="md"><b>MD</b><span>위키·깃에 붙이는 텍스트 문서 (.md)</span></button>
        <button data-fmt="html"><b>HTML</b><span>색과 표가 있는 단독 파일 (.html)</span></button>
      </div>
      <label class="key">API 키 <input id="rpKey" type="password" placeholder="서버에 키가 설정된 경우만" value="${esc(lsGet("vizier.reportKey"))}"></label>
      <div class="muted" style="font-size:12px">검증 결과에 있는 이슈만으로 문서를 씁니다. 다시 분석하지 않습니다.</div>
    </div>`;
  $("tabRp").disabled = false; setTab("rp");
}

function renderMd() {
  RP.mdQueued = false;
  const box = $("rpMd"); if (!box) return;
  const cursor = RP.done ? "" : " cursor";
  if (RP.showRaw || !window.marked || !window.DOMPurify) {
    box.innerHTML = `<pre class="raw${cursor}">${esc(RP.raw)}</pre>`;
  } else {
    box.innerHTML = mdHtml(RP.raw);
    box.classList.toggle("cursor", !RP.done);
  }
  followTail();
}
function queueMd() { if (!RP.mdQueued) { RP.mdQueued = true; requestAnimationFrame(renderMd); } }

// HTML: 같은 출처 샌드박스 iframe(스크립트 불가)에 새로 받은 부분만 이어 쓰기 → 약 0.3초마다 묶어서 갱신
function flushHtml() {
  const doc = RP.doc; if (!doc) return;
  if (RP.writtenHtml < RP.raw.length) { doc.write(RP.raw.slice(RP.writtenHtml)); RP.writtenHtml = RP.raw.length; }
  const f = $("rpFrame"); if (f && doc.documentElement) { f.style.height = "0px"; f.style.height = doc.documentElement.scrollHeight + "px"; }
  followTail();
}
function followTail() { const b = $("rpBody"); if (RP.followTail && !RP.done) b.scrollTop = b.scrollHeight; }

function showMetrics(done) {
  const parts = [];
  if (RP.tFirst) parts.push(`첫 글자 ${((RP.tFirst - RP.t0) / 1000).toFixed(1)}초`);
  parts.push(`전체 ${((performance.now() - RP.t0) / 1000).toFixed(1)}초`);
  if (done && done.usage) parts.push(`토큰 입력 ${done.usage.input_tokens ?? "-"} · 출력 ${done.usage.output_tokens ?? "-"}`);
  if (done && done.cost_usd != null) parts.push(`약 $${done.cost_usd.toFixed(4)}`);
  if (done && done.model) parts.push(done.model);
  setMetrics(parts.join(" · "));
}

async function startReport(fmt) {
  const key = ($("rpKey") && $("rpKey").value.trim()) || ""; lsSet("vizier.reportKey", key);
  Object.assign(RP, { fmt, raw: "", done: false, showRaw: false, t0: performance.now(), tFirst: 0, headSkipped: fmt !== "html",
    writtenHtml: 0, mdQueued: false, doc: null, followTail: true, shown: false });
  const ctrl = RP.ctrl = new AbortController();
  const snap = { rule: validated.rule, validation: result };
  rpButtons({ stop: true, raw: fmt === "md" }); $("rpRaw").textContent = "원문 보기";
  setMetrics(""); $("rpProgress").hidden = tab !== "rp";
  const waitText = () => `${fmt.toUpperCase()} 리포트 작성 준비 중…(경과 ${Math.floor((performance.now() - RP.t0) / 1000)}초)`;
  rpStatus(waitText()); clearInterval(RP.tick);
  RP.tick = setInterval(() => { if (RP.tFirst) { clearInterval(RP.tick); rpStatus(`${fmt.toUpperCase()} 작성 중…`); } else rpStatus(waitText()); }, 1000);
  if (fmt === "md") {
    $("rpBody").innerHTML = `<div class="rp-doc mdv" id="rpMd"></div>`; renderMd();
  } else {
    $("rpBody").innerHTML = `<iframe class="rp-frame" id="rpFrame" sandbox="allow-same-origin" title="HTML 리포트 미리보기"></iframe>`;
    RP.doc = $("rpFrame").contentDocument; RP.doc.open();
    RP.timer = setInterval(flushHtml, 300);
  }
  const headers = { "Content-Type": "application/json" };
  if (key) headers["X-API-Key"] = key;
  let doneEvt = null, errMsg = null;
  try {
    const r = await fetch(base() + "/rules/report/stream", { method: "POST", headers, signal: ctrl.signal,
      body: JSON.stringify({ format: fmt, rule: snap.rule, validation: snap.validation }) });
    if (!r.ok || !r.body) {
      const b = await r.json().catch(() => null);
      const d = b && b.detail;
      errMsg = (typeof d === "string" ? d : d && (d.message || d.error)) || `서버가 ${r.status} 응답을 보냈습니다.`;
    } else {
      const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
      for (;;) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const block = buf.slice(0, i); buf = buf.slice(i + 2);
          const line = block.split("\n").find((l) => l.startsWith("data: ")); if (!line) continue;
          const ev = JSON.parse(line.slice(6));
          if (ev.type === "delta") {
            if (!RP.headSkipped) RP.headSkipped = true; // HTML 머리(서버 고정 스타일)는 첫 글자 시간에서 제외
            else if (!RP.tFirst) RP.tFirst = performance.now();
            if (RP.tFirst && !RP.shown) { RP.shown = true; rpStatus(`${fmt.toUpperCase()} 작성 중…`); }
            RP.raw += ev.text;
            if (fmt === "md") queueMd();
          } else if (ev.type === "done") doneEvt = ev;
          else if (ev.type === "error") errMsg = ev.message;
        }
      }
      if (!doneEvt && !errMsg) errMsg = "서버 연결이 끊겨 리포트가 끝까지 오지 않았습니다.";
    }
  } catch (e) {
    if (e.name === "AbortError") errMsg = "__stopped";
    else errMsg = `서버에 연결하지 못했습니다 (${base()}). ${e.message}`;
  }
  if (RP.ctrl !== ctrl) return; // 그 사이 트리 수정·재검증으로 리포트가 초기화됨
  RP.ctrl = null; RP.done = true; clearInterval(RP.timer); clearInterval(RP.tick); $("rpProgress").hidden = true;
  if (fmt === "html") { flushHtml(); try { RP.doc.close(); } catch { /* 무시 */ } setTimeout(flushHtml, 50); } else renderMd();
  showMetrics(doneEvt);
  if (errMsg === "__stopped") { rpStatus("중지했습니다. 받은 부분까지만 보입니다.", "bad"); rpButtons({ again: true, raw: fmt === "md" }); return; }
  if (errMsg) {
    rpStatus(RP.raw ? "오류로 중단됨 (받은 부분은 유지)" : "리포트를 만들지 못했습니다", "bad");
    $("rpBody").insertAdjacentHTML("afterbegin", `<div class="err-box rp-err">${esc(errMsg)}</div>`);
    rpButtons({ again: true, raw: fmt === "md" && !!RP.raw }); return;
  }
  if (doneEvt.warning) { rpStatus(doneEvt.warning, "bad"); rpButtons({ again: true, download: true, raw: fmt === "md" }); return; }
  rpStatus(`${fmt.toUpperCase()} 완료`, "ok"); rpButtons({ again: true, download: true, raw: fmt === "md" });
}

$("btnReport").addEventListener("click", openReport);
$("rpBody").addEventListener("click", (e) => { const t = e.target.closest("[data-fmt]"); if (t) startReport(t.dataset.fmt); });
$("rpBody").addEventListener("scroll", () => { const b = $("rpBody"); RP.followTail = b.scrollHeight - b.scrollTop - b.clientHeight < 40; });
$("rpStop").addEventListener("click", () => { if (RP.ctrl) RP.ctrl.abort(); });
$("rpAgain").addEventListener("click", openReport);
$("rpRaw").addEventListener("click", () => { RP.showRaw = !RP.showRaw; $("rpRaw").textContent = RP.showRaw ? "문서 모양으로" : "원문 보기"; renderMd(); });
$("rpDownload").addEventListener("click", () => {
  const blob = new Blob([RP.raw], { type: RP.fmt === "md" ? "text/markdown;charset=utf-8" : "text/html;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = reportFileName();
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

document.body.insertAdjacentHTML("beforeend", `<datalist id="ops">${OPERATORS.map((o) => `<option value="${esc(o)}">`).join("")}</datalist>`);
$("sample").innerHTML = Object.keys(SAMPLES).map((k) => `<option value="${k}">${esc(SAMPLE_LABELS[k] || k)}</option>`).join("");
loadRule(SAMPLES[Object.keys(SAMPLES)[0]][0]);
</script>
